<!--
    Main page template for URL shortening service.
  
    Provides a form for submitting URLs, displays generated short links,
    and shows error messages when validation fails.
  
    Features:
    - Responsive design with mobile support
    - Copy-to-clipboard functionality
    - Smooth animations and transitions
    - Error handling with user-friendly messages
  
    Dependencies:
    - styles.css (application styling)
    - main.js (client-side functionality)
    - Font Awesome 6.4.0 (icons)
-->
<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Link Shorter</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Бесплатный сервис для сокращения ссылок">
    <meta name="keywords" content="сокращение ссылок, короткие ссылки, link shorter">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="{{ url_for('static', filename='main.js') }}" type="text/javascript"></script>
</head>
<body>
    <div class="container">
        <section class="header">
            <span class="label-text">
                <i class="fas fa-link"></i>
                СОКРАЩАТЕЛЬ
            </span>
            <p class="subtitle">Превратите длинные ссылки в короткие и удобные!</p>
        </section>

        <!-- Form for URL submission - submits to same page via POST -->
        <form action="" method="post">
            <section id="input">
                <div class="input-group">
                    <label for="original_link">
                        <i class="fas fa-paperclip"></i>
                        Длинная ссылка
                    </label>
                    <div class="input-wrapper">
                        <!-- Preserve original_link value if validation fails -->
                        <input type="text" name="original_link" id="url" required 
                               placeholder="Вставьте вашу ссылку здесь..."
                               value="{{ original_link or '' }}">
                        <div class="input-focus-line"></div>
                    </div>
                </div>
                <button type="submit" name="shorten" class="submit-btn">
                    <i class="fas fa-magic"></i>
                    Жмать сюда!
                    <div class="btn-shine"></div>
                </button>
            </section>
        </form>

        <!-- Success section - only shown when output is available -->
        {% if output %}
        <section id="output">
            <div class="output-group">
                <label for="output">
                    <i class="fas fa-rocket"></i>
                    Короткая ссылка
                </label>
                <div class="output-wrapper">
                    <p id="short-link">{{ output }}</p>
                    <button class="copy-btn" onclick="copyToClipboard()" title="Скопировать">
                        <i class="far fa-copy"></i>
                    </button>
                </div>
                <div class="copy-message" id="copy-message">Ссылка скопирована!</div>
            </div>
        </section>
        {% endif %}

        <!-- Error message section - only shown when error exists -->
        {% if error %}
        <div class="error-message">
            <i class="fas fa-exclamation-triangle"></i>
            {{ error }}
        </div>
        {% endif %}

        <footer class="production">
            <span>Copyright © 2025 JaneKKTTme</span>
        </footer>
    </div>
</body>
</html>
